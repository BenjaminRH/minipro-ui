[project]
name = "minipro-ui"
version = "0.1.0"
description = "A friendly terminal workbench for the minipro chip programmer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=6.0,<9",
    "platformdirs>=4.3,<5",
    "textual-image[textual]>=0.14,<0.15",
]

[project.scripts]
minipro-ui = "minipro_ui.__main__:main"
minipro-ui-extract-images = "minipro_ui.xgpro_images:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "mypy>=1.15"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.build-backend]
source-include = ["tests/**", "tools/**", "uv.lock"]
