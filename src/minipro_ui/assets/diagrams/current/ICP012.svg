<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="0" y="0" width="1400" height="900" fill="#ffffff" stroke="#ffffff" stroke-width="2" rx="8"/><text x="48" y="54" font-family="sans-serif" font-size="34px" font-weight="700" fill="#17202a">SPI KB901x/9022 driver output</text><text x="48" y="91" font-family="sans-serif" font-size="18px" font-weight="400" fill="#536273">Wiring reference / ICP012.jpg</text><text x="48" y="125" font-family="sans-serif" font-size="20px" font-weight="700" fill="#1d5f8f">Programmer compatibility: TL866II</text><rect x="48" y="171" width="430" height="352" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><rect x="922" y="171" width="430" height="352" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><text x="68" y="205" font-family="sans-serif" font-size="22px" font-weight="700" fill="#17202a">SPI buffer driver</text><text x="68" y="235" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Intermediate SPI Driver output</text><text x="942" y="205" font-family="sans-serif" font-size="22px" font-weight="700" fill="#17202a">KB901x/9022</text><text x="942" y="235" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Target-side named terminals</text><text x="68" y="273" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">Driver pin 6 CLK</text><text x="942" y="273" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">60# KSI5</text><line x1="478" y1="267" x2="922" y2="267" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="307" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">Driver pin 5 MISO</text><text x="942" y="307" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">62# KSI7</text><line x1="478" y1="301" x2="922" y2="301" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="341" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">Driver pin 4 MOSI</text><text x="942" y="341" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">61# KSI6</text><line x1="478" y1="335" x2="922" y2="335" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="375" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">Driver pin 3 GND</text><text x="942" y="375" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">target GND and 42# KSO3</text><line x1="478" y1="369" x2="922" y2="369" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="409" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">Driver pin 2 NC</text><text x="426" y="409" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">NC</text><line x1="478" y1="403" x2="503" y2="403" stroke="#536273" stroke-width="2"/><line x1="496" y1="395" x2="510" y2="411" stroke="#536273" stroke-width="2"/><line x1="510" y1="395" x2="496" y2="411" stroke="#536273" stroke-width="2"/><text x="68" y="443" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">Driver pin 1 /CS</text><text x="942" y="443" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">59# KSI4</text><line x1="478" y1="437" x2="922" y2="437" stroke="#1d5f8f" stroke-width="2"/><rect x="500" y="547" width="380" height="64" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><text x="520" y="575" font-family="sans-serif" font-size="18px" font-weight="700" fill="#17202a">External power</text><text x="690" y="575" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Target VCC</text><circle cx="922" cy="489" r="7" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="940" y="495" font-family="sans-serif" font-size="15px" font-weight="400" fill="#536273">external VCC terminal</text><line x1="880" y1="579" x2="898" y2="579" stroke="#1d5f8f" stroke-width="2"/><line x1="898" y1="579" x2="898" y2="489" stroke="#1d5f8f" stroke-width="2"/><line x1="898" y1="489" x2="922" y2="489" stroke="#1d5f8f" stroke-width="2"/><text x="48" y="637" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Connection note: Target VCC requires a separate external power supply; the upstream TL866II-to-driver wiring is unspecified.</text><text x="48" y="671" font-family="sans-serif" font-size="20px" font-weight="700" fill="#17202a">Connections and notes</text><text x="48" y="701" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* The intermediate SPI Driver output header is numbered bottom-up: pin 6 CLK -&gt; 60#(KSI5), pin 5 MISO &lt;- 62#(KSI7), pin 4 MOSI -&gt; 61#(KSI6), pin 3 GND -&gt; target GND and</text><text x="48" y="726" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">  42#(KSO3), pin 2 is crossed out/NC, and pin 1 /CS -&gt; 59#(KSI4).</text><text x="48" y="751" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* Target VCC is supplied by External Power.</text><text x="48" y="776" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: The intermediate SPI Driver has two six-pin sides; the output-header mapping is shown, while the upstream TL866II-to-driver mapping is unspecified.</text></svg>
