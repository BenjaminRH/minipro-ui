<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="0" y="0" width="1400" height="900" fill="#ffffff" stroke="#ffffff" stroke-width="2" rx="8"/><text x="48" y="54" font-family="sans-serif" font-size="34px" font-weight="700" fill="#17202a">eMMC ISP driver outputs</text><text x="48" y="91" font-family="sans-serif" font-size="18px" font-weight="400" fill="#536273">Wiring reference / T48ICP064.jpg</text><text x="48" y="125" font-family="sans-serif" font-size="20px" font-weight="700" fill="#1d5f8f">Programmer compatibility: T48</text><rect x="48" y="171" width="430" height="440" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><rect x="922" y="171" width="430" height="440" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><text x="68" y="205" font-family="sans-serif" font-size="22px" font-weight="700" fill="#17202a">T48 eMMC ISP driver</text><text x="68" y="235" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">T48 16-pin ISP</text><text x="942" y="205" font-family="sans-serif" font-size="22px" font-weight="700" fill="#17202a">eMMC</text><text x="942" y="235" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Target-side named terminals</text><text x="68" y="273" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">VCC (optional)</text><text x="942" y="273" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC VCC (disconnect if externally powered)</text><line x1="478" y1="267" x2="922" y2="267" stroke="#1d5f8f" stroke-width="2" stroke-dasharray="8 6"/><text x="68" y="307" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">VCCQ (optional)</text><text x="942" y="307" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC VCCQ (disconnect if externally powered)</text><line x1="478" y1="301" x2="922" y2="301" stroke="#1d5f8f" stroke-width="2" stroke-dasharray="8 6"/><text x="68" y="341" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">GND</text><text x="942" y="341" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC GND</text><line x1="478" y1="335" x2="922" y2="335" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="375" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">CLK</text><text x="942" y="375" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC CLK</text><line x1="478" y1="369" x2="922" y2="369" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="409" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">GND</text><text x="942" y="409" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC GND</text><line x1="478" y1="403" x2="922" y2="403" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="443" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">CMD</text><text x="942" y="443" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC CMD</text><line x1="478" y1="437" x2="922" y2="437" stroke="#1d5f8f" stroke-width="2"/><text x="68" y="477" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">D3 (optional)</text><text x="942" y="477" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC D3 (4-bit mode)</text><line x1="478" y1="471" x2="922" y2="471" stroke="#1d5f8f" stroke-width="2" stroke-dasharray="8 6"/><text x="68" y="511" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">D2 (optional)</text><text x="942" y="511" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC D2 (4-bit mode)</text><line x1="478" y1="505" x2="922" y2="505" stroke="#1d5f8f" stroke-width="2" stroke-dasharray="8 6"/><text x="68" y="545" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">D1 (optional)</text><text x="942" y="545" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC D1 (4-bit mode)</text><line x1="478" y1="539" x2="922" y2="539" stroke="#1d5f8f" stroke-width="2" stroke-dasharray="8 6"/><text x="68" y="579" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">D0</text><text x="942" y="579" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">eMMC D0</text><line x1="478" y1="573" x2="922" y2="573" stroke="#1d5f8f" stroke-width="2"/><text x="48" y="635" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Connection note: Leave VCC and VCCQ disconnected when using external target power. D1-D3 are required for 4-bit mode; keep the adjacent GND/CLK/GND group together.</text><text x="48" y="669" font-family="sans-serif" font-size="20px" font-weight="700" fill="#17202a">Connections and notes</text><text x="48" y="699" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* The EMMC ISP DRIVER output strip is VCC, VCCQ, GND, CLK, GND, CMD, D3 (4bits), D2 (4bits), D1 (4bits), D0.</text><text x="48" y="724" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: The direct T48 ISP header-to-driver pin mapping is unspecified.</text><text x="48" y="749" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: VCC and VCCQ are marked not to be connected when external target power is used.</text><text x="48" y="774" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: The three adjacent wires around GND, CLK, GND should not be separated.</text></svg>
