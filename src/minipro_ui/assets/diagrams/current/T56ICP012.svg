<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="0" y="0" width="1400" height="900" fill="#ffffff" stroke="#ffffff" stroke-width="2" rx="8"/><text x="48" y="54" font-family="sans-serif" font-size="34px" font-weight="700" fill="#17202a">SPI KB901x/9022</text><text x="48" y="91" font-family="sans-serif" font-size="18px" font-weight="400" fill="#536273">Wiring reference / T56ICP012.jpg</text><text x="48" y="125" font-family="sans-serif" font-size="20px" font-weight="700" fill="#1d5f8f">Programmer compatibility: T56</text><rect x="48" y="171" width="550" height="492" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><text x="68" y="207" font-family="sans-serif" font-size="24px" font-weight="700" fill="#17202a">Connector</text><text x="68" y="238" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">8 pins</text><text x="68" y="260" font-family="sans-serif" font-size="14px" font-weight="400" fill="#536273">single row, pin 8 at top and pin 1 at bottom</text><circle cx="84" cy="283" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="290" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">8</text><circle cx="84" cy="328" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="335" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">7</text><circle cx="84" cy="373" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="380" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">6</text><circle cx="84" cy="418" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="425" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">5</text><circle cx="84" cy="463" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="470" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">4</text><circle cx="84" cy="508" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="515" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">3</text><circle cx="84" cy="553" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="560" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">2</text><circle cx="84" cy="598" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="605" font-family="sans-serif" font-size="14px" font-weight="700" fill="#17202a">1</text><rect x="650" y="171" width="702" height="308" fill="#ffffff" stroke="#9db2c2" stroke-width="2" rx="8"/><text x="668" y="205" font-family="sans-serif" font-size="23px" font-weight="700" fill="#17202a">Programmer pin mapping</text><text x="668" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Pin</text><text x="798" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Signal -&gt; target</text><text x="668" y="262" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">8</text><text x="798" y="262" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">NC -&gt; not connected to target; External Power supplies target VCC [nc]</text><text x="798" y="284" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">(optional)</text><text x="668" y="320" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">7, 3, 1</text><text x="798" y="320" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">GND -&gt; target GND / 42#(KSO3) [ground]</text><text x="668" y="356" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">6</text><text x="798" y="356" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">MISO -&gt; target 62#(KSI7) [input]</text><text x="668" y="392" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">5</text><text x="798" y="392" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">MOSI -&gt; target 61#(KSI6) [output]</text><text x="668" y="428" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">4</text><text x="798" y="428" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">/CS -&gt; target 59#(KSI4) [output]</text><text x="668" y="464" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">2</text><text x="798" y="464" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">CLK -&gt; target 60#(KSI5) [output]</text><text x="48" y="699" font-family="sans-serif" font-size="20px" font-weight="700" fill="#17202a">Connections and notes</text><text x="48" y="729" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* Target VCC is supplied by External Power.</text><text x="48" y="754" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: The programmer VCC line is shown stopping before the target rail; do not connect it to the externally powered target VCC.</text><text x="48" y="779" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: The three adjacent wires at programmer pins 3,2,1 (GND, 60#(KSI5), GND) should not be separated.</text></svg>
