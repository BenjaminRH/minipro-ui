<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="902" viewBox="0 0 1400 902"><rect x="0" y="0" width="1400" height="902" fill="#ffffff" stroke="#ffffff" stroke-width="2" rx="8"/><text x="48" y="54" font-family="sans-serif" font-size="34px" font-weight="700" fill="#17202a">eMMC ISP 4-bit connection</text><text x="48" y="91" font-family="sans-serif" font-size="18px" font-weight="400" fill="#536273">Wiring reference / T56ICP064.jpg</text><text x="48" y="125" font-family="sans-serif" font-size="20px" font-weight="700" fill="#1d5f8f">Programmer compatibility: T56</text><rect x="48" y="171" width="550" height="492" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><text x="68" y="207" font-family="sans-serif" font-size="24px" font-weight="700" fill="#17202a">Connector</text><text x="68" y="238" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">8 pins</text><text x="68" y="260" font-family="sans-serif" font-size="14px" font-weight="400" fill="#536273">single row, pin 8 at top and pin 1 at bottom</text><circle cx="84" cy="283" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="290" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">8</text><circle cx="84" cy="328" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="335" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">7</text><circle cx="84" cy="373" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="380" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">6</text><circle cx="84" cy="418" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="425" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">5</text><circle cx="84" cy="463" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="470" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">4</text><circle cx="84" cy="508" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="515" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">3</text><circle cx="84" cy="553" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="560" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">2</text><circle cx="84" cy="598" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="605" font-family="sans-serif" font-size="14px" font-weight="700" fill="#17202a">1</text><rect x="650" y="171" width="702" height="322" fill="#ffffff" stroke="#9db2c2" stroke-width="2" rx="8"/><text x="668" y="205" font-family="sans-serif" font-size="23px" font-weight="700" fill="#17202a">Programmer pin mapping</text><text x="668" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Pin</text><text x="798" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Signal -&gt; target</text><text x="668" y="262" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">8</text><text x="798" y="262" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">D3 -&gt; target D3 (4bits) [bidirectional] (optional)</text><text x="668" y="298" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">7</text><text x="798" y="298" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">D2 -&gt; target D2 (4bits) [bidirectional] (optional)</text><text x="668" y="334" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">6</text><text x="798" y="334" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">D1 -&gt; target D1 (4bits) [bidirectional] (optional)</text><text x="668" y="370" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">5</text><text x="798" y="370" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">D0 -&gt; target D0 [bidirectional]</text><text x="668" y="406" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">4</text><text x="798" y="406" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">CMD -&gt; target CMD [bidirectional]</text><text x="668" y="442" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">3, 1</text><text x="798" y="442" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">GND -&gt; target GND [ground]</text><text x="668" y="478" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">2</text><text x="798" y="478" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">CLK -&gt; target CLK [output]</text><text x="48" y="699" font-family="sans-serif" font-size="20px" font-weight="700" fill="#17202a">Connections and notes</text><text x="48" y="729" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* Connect D3,D2,D1 when 4 Bits width is used.</text><text x="48" y="754" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: Wire length is shown as less than 25 cm.</text><text x="48" y="779" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: The socket-side labels show GND, VCCQ, VCCQ, GND on one side and VCC, VCC, GND on the other; the socket drawing marks Pin1.</text><text x="48" y="804" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: VCCQ is available at 3.3 V and high impedance at 1.8 V. Use external power at 1.8 V; socket power is optional.</text><text x="48" y="829" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: The three adjacent wires at programmer pins 3,2,1 (GND, CLK, GND) should not be separated.</text></svg>
