<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect x="0" y="0" width="1400" height="900" fill="#ffffff" stroke="#ffffff" stroke-width="2" rx="8"/><text x="48" y="54" font-family="sans-serif" font-size="34px" font-weight="700" fill="#17202a">SN006 25-series 1.8 V 8-pin flash adapter</text><text x="48" y="91" font-family="sans-serif" font-size="18px" font-weight="400" fill="#536273">Adapter reference / Adapter008.jpg</text><text x="48" y="125" font-family="sans-serif" font-size="20px" font-weight="700" fill="#1d5f8f">Programmer compatibility: TL866A, TL866CS</text><rect x="48" y="171" width="550" height="316" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><text x="68" y="207" font-family="sans-serif" font-size="24px" font-weight="700" fill="#17202a">Connector</text><text x="68" y="238" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">8 pins</text><text x="68" y="260" font-family="sans-serif" font-size="14px" font-weight="400" fill="#536273">Flash pin 1 upper-left; adapter pin 1 upper-left.</text><circle cx="84" cy="283" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="290" font-family="sans-serif" font-size="14px" font-weight="700" fill="#17202a">1</text><circle cx="319" cy="283" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="290" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">8</text><circle cx="84" cy="329" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="336" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">2</text><circle cx="319" cy="329" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="336" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">7</text><circle cx="84" cy="375" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="382" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">3</text><circle cx="319" cy="375" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="382" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">6</text><circle cx="84" cy="421" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="428" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">4</text><circle cx="319" cy="421" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="428" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">5</text><rect x="650" y="171" width="702" height="358" fill="#ffffff" stroke="#9db2c2" stroke-width="2" rx="8"/><text x="668" y="205" font-family="sans-serif" font-size="23px" font-weight="700" fill="#17202a">Flash pin mapping</text><text x="668" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Pin</text><text x="798" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Signal -&gt; target</text><text x="668" y="262" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">1</text><text x="798" y="262" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 1 -&gt; adapter pin 1#</text><text x="668" y="298" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">2</text><text x="798" y="298" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 2 -&gt; adapter pin 2#</text><text x="668" y="334" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">4</text><text x="798" y="334" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">GND -&gt; adapter pin 4#</text><text x="668" y="370" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">5</text><text x="798" y="370" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 5 -&gt; adapter pin 37#</text><text x="668" y="406" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">6</text><text x="798" y="406" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 6 -&gt; adapter pin 38#</text><text x="668" y="442" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">7</text><text x="798" y="442" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 7 -&gt; adapter pin 39#</text><text x="668" y="478" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">8</text><text x="798" y="478" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">1.8 V rail -&gt; LM1117 1.8 V output</text><text x="668" y="514" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">3</text><text x="798" y="514" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 3 -&gt; 1 K branch from 1.8 V rail</text><text x="48" y="565" font-family="sans-serif" font-size="20px" font-weight="700" fill="#17202a">Connections and notes</text><text x="48" y="595" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* LM1117 regulator marked 1.8 V; input is adapter pin 40#.</text><text x="48" y="620" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* Two 0.1u capacitors are shown from regulator input/output rails to ground.</text><text x="48" y="645" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* A 1K resistor is shown from the 1.8 V rail to flash pin 3.</text><text x="48" y="670" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* Four BAT54C diodes clamp flash pins 1, 5, 6, and 7: their anodes are at those flash pins and their cathodes are at the 1.8 V rail.</text><text x="48" y="695" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: This is a 25-series 1.8 V flash PIN8 mapping.</text></svg>
