<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="927" viewBox="0 0 1400 927"><rect x="0" y="0" width="1400" height="927" fill="#ffffff" stroke="#ffffff" stroke-width="2" rx="8"/><text x="48" y="54" font-family="sans-serif" font-size="34px" font-weight="700" fill="#17202a">SN007 25-series 1.8 V 16-pin flash adapter</text><text x="48" y="91" font-family="sans-serif" font-size="18px" font-weight="400" fill="#536273">Adapter reference / Adapter009.jpg</text><text x="48" y="125" font-family="sans-serif" font-size="20px" font-weight="700" fill="#1d5f8f">Programmer compatibility: TL866A, TL866CS</text><rect x="48" y="171" width="550" height="492" fill="#eaf3f8" stroke="#1d5f8f" stroke-width="2" rx="8"/><text x="68" y="207" font-family="sans-serif" font-size="24px" font-weight="700" fill="#17202a">Connector</text><text x="68" y="238" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">16 pins</text><text x="68" y="260" font-family="sans-serif" font-size="14px" font-weight="400" fill="#536273">Flash pin 1 upper-left; adapter pin 1 upper-left.</text><circle cx="84" cy="283" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="290" font-family="sans-serif" font-size="14px" font-weight="700" fill="#17202a">1</text><circle cx="319" cy="283" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="290" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">16</text><circle cx="84" cy="328" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="335" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">2</text><circle cx="319" cy="328" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="335" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">15</text><circle cx="84" cy="373" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="380" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">3</text><circle cx="319" cy="373" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="380" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">14</text><circle cx="84" cy="418" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="425" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">4</text><circle cx="319" cy="418" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="425" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">13</text><circle cx="84" cy="463" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="470" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">5</text><circle cx="319" cy="463" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="470" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">12</text><circle cx="84" cy="508" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="515" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">6</text><circle cx="319" cy="508" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="515" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">11</text><circle cx="84" cy="553" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="560" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">7</text><circle cx="319" cy="553" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="560" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">10</text><circle cx="84" cy="598" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="80" y="605" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">8</text><circle cx="319" cy="598" r="15" fill="#ffffff" stroke="#1d5f8f" stroke-width="2"/><text x="315" y="605" font-family="sans-serif" font-size="14px" font-weight="400" fill="#17202a">9</text><rect x="650" y="171" width="702" height="358" fill="#ffffff" stroke="#9db2c2" stroke-width="2" rx="8"/><text x="668" y="205" font-family="sans-serif" font-size="23px" font-weight="700" fill="#17202a">Flash pin mapping</text><text x="668" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Pin</text><text x="798" y="232" font-family="sans-serif" font-size="14px" font-weight="700" fill="#536273">Signal -&gt; target</text><text x="668" y="262" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">1</text><text x="798" y="262" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 1 -&gt; adapter pin 1#</text><text x="668" y="298" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">7</text><text x="798" y="298" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 7 -&gt; adapter pin 7#</text><text x="668" y="334" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">8</text><text x="798" y="334" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 8 -&gt; adapter pin 8#</text><text x="668" y="370" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">10</text><text x="798" y="370" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 10 -&gt; adapter pin 34# / GND</text><text x="668" y="406" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">15</text><text x="798" y="406" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 15 -&gt; adapter pin 39#</text><text x="668" y="442" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">16</text><text x="798" y="442" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 16 -&gt; adapter pin 40#</text><text x="668" y="478" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">2</text><text x="798" y="478" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 2 -&gt; LM1117 1.8 V output [power]</text><text x="668" y="514" font-family="sans-serif" font-size="16px" font-weight="700" fill="#17202a">9</text><text x="798" y="514" font-family="sans-serif" font-size="16px" font-weight="400" fill="#17202a">flash pin 9 -&gt; 1 K resistor to 1.8 V rail</text><text x="48" y="699" font-family="sans-serif" font-size="20px" font-weight="700" fill="#17202a">Connections and notes</text><text x="48" y="729" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* LM1117 regulator marked 1.8 V; input is adapter pin 2#.</text><text x="48" y="754" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* Two 0.1u capacitors are shown from regulator input/output rails to ground.</text><text x="48" y="779" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* A 1K resistor is shown from the 1.8 V rail to flash pin 9.</text><text x="48" y="804" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* Four BAT54C diode symbols clamp flash pins 1, 7, 15, and 16: their anodes are at those flash pins and their cathodes are at the 1.8 V rail.</text><text x="48" y="829" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">* All other flash pins are left unconnected.</text><text x="48" y="854" font-family="sans-serif" font-size="16px" font-weight="400" fill="#536273">Note: This is a 25-series 1.8 V flash PIN16 mapping.</text></svg>
